# ===== Application =====
spring.application.name=hostelms
server.port=8080

# ===== PostgreSQL Connection =====
# Create the database first:  CREATE DATABASE hostel_management;
spring.datasource.url=jdbc:postgresql://localhost:5432/hostel_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Seed data (default hostels) runs after Hibernate creates the tables
spring.sql.init.mode=always

# ===== JWT (secures the REST API that the built-in React frontend calls) =====
# Change this secret before any real deployment - it must stay private.
jwt.secret=Y2hhbmdlLXRoaXMtaG9zdGVsLW1zLWp3dC1zZWNyZXQta2V5LTMyYnl0ZXMh
jwt.expiration-ms=86400000

# ===== CORS =====
# Only needed if you run "npm run dev" separately (frontend on :5173) while
# developing. Once the frontend is built into src/main/resources/static,
# everything is served from :8080 and CORS doesn't come into play at all.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
